<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - Esports Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .auth-card { background: #111827; border: 1px solid #1f293d; border-radius: 16px; width: 100%; max-width: 420px; padding: 30px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); }
        .auth-header { text-align: center; margin-bottom: 25px; }
        .auth-header h2 { font-size: 24px; color: #fff; margin-bottom: 8px; }
        .auth-header p { font-size: 13px; color: #94a3b8; }
        .tab-buttons { display: flex; background: #0b0f19; padding: 4px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #1f293d; }
        .tab-btn { flex: 1; padding: 10px; background: none; border: none; color: #94a3b8; font-weight: 600; cursor: pointer; border-radius: 6px; transition: 0.2s; }
        .tab-btn.active { background: #a78bfa; color: #0b0f19; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; font-weight: 700; }
        .form-group input { width: 100%; padding: 12px; background: #0b0f19; border: 1px solid #1f293d; border-radius: 8px; color: #fff; outline: none; }
        .form-group input:focus { border-color: #a78bfa; }
        .submit-btn { width: 100%; padding: 12px; background: #a78bfa; color: #0b0f19; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .submit-btn:hover { background: #8b5cf6; }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="auth-header">
        <h2 id="formTitle">Welcome Back</h2>
        <p id="formSubtitle">Please enter your credentials to login</p>
    </div>

    <div class="tab-buttons">
        <button class="tab-btn active" id="loginTab" onclick="switchTab('login')">Login</button>
        <button class="tab-btn" id="registerTab" onclick="switchTab('register')">Register</button>
    </div>

    <form id="authForm">
        <div class="form-group" id="nameGroup" style="display: none;">
            <label>Full Name</label>
            <input type="text" id="authName" placeholder="John Doe">
        </div>

        <div class="form-group" id="orgGroup" style="display: none;">
            <label>Organization Name</label>
            <input type="text" id="authOrg" placeholder="LOVERS ESPORTS">
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="authEmail" required placeholder="admin@lovers.com">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="authPassword" required placeholder="••••••••">
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Log In</button>
    </form>
</div>

<script>
    let mode = 'login';

    function switchTab(newMode) {
        mode = newMode;
        document.getElementById('loginTab').classList.toggle('active', mode === 'login');
        document.getElementById('registerTab').classList.toggle('active', mode === 'register');
        
        document.getElementById('nameGroup').style.display = mode === 'register' ? 'block' : 'none';
        document.getElementById('orgGroup').style.display = mode === 'register' ? 'block' : 'none';
        
        document.getElementById('formTitle').innerText = mode === 'login' ? 'Welcome Back' : 'Create Account';
        document.getElementById('formSubtitle').innerText = mode === 'login' ? 'Please enter your credentials to login' : 'Fill details to register as new organizer';
        document.getElementById('submitBtn').innerText = mode === 'login' ? 'Log In' : 'Register Now';
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;

        if (mode === 'login') {
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    localStorage.setItem('user_profile', JSON.stringify(data.profile));
                    window.location.href = 'index.html';
                } else {
                    alert(data.message);
                }
            } catch (err) {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('currentUser', JSON.stringify({ email, name: email.split('@')[0] }));
                window.location.href = 'index.html';
            }
        } else {
            const name = document.getElementById('authName').value;
            const orgName = document.getElementById('authOrg').value;

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, orgName })
                });
                const data = await res.json();

                if (data.success) {
                    alert("Registration successful! Logging you in...");
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    localStorage.setItem('user_profile', JSON.stringify(data.profile));
                    window.location.href = 'index.html';
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("Registered!");
                localStorage.setItem('isLoggedIn', 'true');
                window.location.href = 'index.html';
            }
        }
    });
</script>
</body>
</html>
